<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PHOTO LOG</title>
<style>
  :root{
    --ink:#000; --sub:#777; --bg:#fff;
    --col:min(560px, 88vw);
    --font:"MS Gothic","ＭＳ ゴシック","MS PGothic","ＭＳ Ｐゴシック","Osaka-Mono","Osaka",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink)}
  body{font-family:var(--font);min-height:100vh;
       -webkit-font-smoothing:none;font-smooth:never}

  .bar{display:flex;justify-content:space-between;padding:10px 14px;font-size:13px}
  .bar a{color:var(--ink)}

  main{padding:40px 0 100px}
  .day{display:flex;flex-direction:column;align-items:center;margin:0 auto 100px}
  .day h2{font-weight:normal;font-size:clamp(28px,4.6vw,42px);letter-spacing:.06em;margin-bottom:20px}
  .shots{width:var(--col);display:flex;flex-direction:column;gap:14px}
  .shots img{display:block;width:100%;height:auto;cursor:zoom-in;background:#eee;min-height:40px}

  .note{text-align:center;color:var(--sub);padding:120px 20px;font-size:14px;line-height:2}
  footer{text-align:center;color:var(--sub);font-size:12px;padding:0 0 30px}

  .lb{position:fixed;inset:0;background:#fff;display:none;align-items:center;justify-content:center;cursor:zoom-out;padding:3vh 3vw}
  .lb.open{display:flex}
  .lb img{max-width:100%;max-height:100%;object-fit:contain}
</style>
</head>
<body>

<div class="bar"><span>PHOTO LOG</span><span id="count"></span></div>
<main id="feed"><p class="note">loading...</p></main>
<footer>(c) PHOTO LOG</footer>
<div class="lb" id="lb"><img id="lbImg" alt=""></div>

<script>
const feed = document.getElementById('feed');
const lb = document.getElementById('lb'), lbImg = document.getElementById('lbImg');

function note(t){ feed.innerHTML = ''; const p = document.createElement('p'); p.className = 'note'; p.textContent = t; feed.appendChild(p); }

fetch('photos.json', {cache: 'no-cache'})
  .then(r => { if(!r.ok) throw 0; return r.json(); })
  .then(days => {
    if(!days.length){ note('まだ写真がありません'); return; }
    let total = 0;
    feed.innerHTML = '';
    for(const day of days){
      const sec = document.createElement('section'); sec.className = 'day';
      const h = document.createElement('h2'); h.textContent = day.date; sec.appendChild(h);
      const col = document.createElement('div'); col.className = 'shots';
      for(const src of day.photos){
        const img = new Image();
        img.loading = 'lazy'; img.alt = day.date; img.src = src;
        img.onclick = () => { lbImg.src = src; lb.classList.add('open'); };
        col.appendChild(img); total++;
      }
      sec.appendChild(col); feed.appendChild(sec);
    }
    document.getElementById('count').textContent = total + ' photos';
  })
  .catch(() => note('photos.json を読み込めませんでした'));

lb.onclick = () => lb.classList.remove('open');
document.addEventListener('keydown', e => { if(e.key === 'Escape') lb.classList.remove('open'); });
</script>
</body>
</html>
